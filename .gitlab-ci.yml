workflow:
  rules:
      # On main branch
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: always
      variables:
        IMAGE_TAG: "latest"
      # On MR
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
      # On Push that's not on an MR
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
      when: always
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
      # On Tag
    - if: $CI_COMMIT_TAG
      when: always
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG

variables:
  TOMCAT_IMAGE_TAG: latest
  MAVEN_IMAGE_TAG: latest

include:
  - component: gitlab.draper.com/swf/templates/ci-cd/container-image-builder/builder-template@main
  
stages:
  - build
  - test
  - release

build:maven:
  extends: [.container_image_builder]
  variables:
    CIB_DOCKERFILE: containerfiles/Containerfile
    CIB_PASSTHROUGH: "--target maven"
    CIB_IMAGE_SUFFIX: maven
    CIB_IMAGE_TAG: ${IMAGE_TAG}
  after_script:
    - echo "MAVEN_IMAGE_TAG=$IMAGE_TAG" >> build.env
  rules:
    - changes:
        - pom.xml
        - containerfiles/Containerfile
  artifacts:
    reports:
      dotenv: build.env


build:tomcat:
  extends: [.container_image_builder]
  variables:
    CIB_DOCKERFILE: containerfiles/Containerfile
    CIB_PASSTHROUGH: "--target tomcat"
    CIB_IMAGE_SUFFIX: tomcat
    CIB_IMAGE_TAG: ${IMAGE_TAG}
  after_script:
    - echo "TOMCAT_IMAGE_TAG=$IMAGE_TAG" >> build.env
  rules:
    - changes:
        - containerfiles/Containerfile
  artifacts:
    reports:
      dotenv: build.env

build:cdms:
  image: registry.draper.com/vader-public/cdms/maven:$MAVEN_IMAGE_TAG
  stage: build
  tags: [podman]
  needs:
    - job: build:maven
      optional: true
  script:
    - mvn clean package
  artifacts:
    paths:
      - $CI_PROJECT_DIR/target/CDMS.war

test:cdms:
  image: registry.draper.com/vader-public/cdms/tomcat:$TOMCAT_IMAGE_TAG
  stage: test
  tags: [podman]
  before_script:
    - set -e
    - export CDMS_HOME="/opt/cdms"
    - mkdir -p ${CDMS_HOME}
    - cp "$CI_PROJECT_DIR/WebContent/META-INF/context.xml" "${CATALINA_HOME}/webapps/manager/META-INF/context.xml"
    - cp "$CI_PROJECT_DIR/tomcat-utils/tomcat-users.xml" "${CATALINA_HOME}/conf/tomcat-users.xml"
    - mv "$CI_PROJECT_DIR/WebContent/WEB-INF/install/emptycdms.db" "${CDMS_HOME}/cdms.db"
    - cp "$CI_PROJECT_DIR/target/CDMS.war" /opt/tomcat/webapps/
  script:
    - /opt/tomcat/bin/catalina.sh start
    - wget --retry-connrefused -t 10 --waitretry=2 --spider http://localhost:8080/CDMS/campaign/get/clusters

