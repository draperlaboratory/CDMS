release:
  stage: release
  tags: [podman]
  script:
    - echo "Releasing $CI_COMMIT_TAG..."
  rules:
    - if: $CI_COMMIT_TAG
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: '$CI_COMMIT_TAG'
